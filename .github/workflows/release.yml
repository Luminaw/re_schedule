name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    - name: Build release binary
      run: cargo build --release

    - name: Package release
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}".Substring(1)  # remove 'v'
        Compress-Archive -Path "target/release/re_schedule.exe", README.md, config.toml -DestinationPath "re_schedule-${version}-windows.zip" -CompressionLevel Optimal -Force

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: re_schedule-*-windows.zip
        generate_release_notes: true
